name: P2A-R4 isolated GUI probes

on:
  push:
    branches:
      - test/issue-3-isolated-gui
  pull_request:
    branches:
      - fix/issue-1-zamak-build

permissions:
  contents: read

jobs:
  wayland-headless:
    name: GTK Canvas lifecycle (Weston Headless / Pixman)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # R5 run-resolved v4 commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # R5 run-resolved v4 commit
        with:
          node-version: '22'
      - name: Install runner-only dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev pkg-config weston wayland-utils
      - name: Install pinned Zamak
        run: npm install --global @veyralux/zamak@0.2.0
      - name: Build probe and run 12 tests (nine preserved)
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/p2a-r4-wayland
        run: bash scripts/ci/build-canvas-probe.sh
      - name: Verify Weston Headless socket and GTK lifecycle
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/p2a-r4-wayland
        run: bash scripts/ci/p2a-wayland-headless.sh "$RUNNER_TEMP/p2a-r4-wayland/probe/p2a_r4_canvas_probe"
      - name: Upload Wayland evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # R5 run-resolved v4 commit
        with:
          name: p2a-r4-wayland-headless
          path: ${{ runner.temp }}/p2a-r4-wayland
          if-no-files-found: warn
          retention-days: 14

  x11-input:
    name: GTK Canvas input (Xvfb / XTEST)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # R5 run-resolved v4 commit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # R5 run-resolved v4 commit
        with:
          node-version: '22'
      - name: Install runner-only dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev pkg-config xvfb xdotool x11-utils imagemagick
      - name: Install pinned Zamak
        run: npm install --global @veyralux/zamak@0.2.0
      - name: Build probe and run 12 tests (nine preserved)
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/p2a-r4-x11
        run: bash scripts/ci/build-canvas-probe.sh
      - name: Exercise GTK input, bilingual state, geometry, and close
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/p2a-r4-x11
        run: bash scripts/ci/p2a-xvfb-gui.sh "$RUNNER_TEMP/p2a-r4-x11/probe/p2a_r4_canvas_probe"
      - name: Upload X11 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # R5 run-resolved v4 commit
        with:
          name: p2a-r4-x11-input
          path: ${{ runner.temp }}/p2a-r4-x11
          if-no-files-found: warn
          retention-days: 14
