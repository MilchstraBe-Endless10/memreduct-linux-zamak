name: build-and-test
on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libgtk-3-dev pkg-config python3
      - name: Verify governance files
        run: python3 scripts/verify_project.py
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Nonprivileged C safety tests
        run: python3 -m unittest discover -s tests -v
      - name: Install pinned Zamak
        run: npm install -g @veyralux/zamak@0.2.0
      - name: Zamak toolchain version
        run: zam --version
      - name: Zamak static check
        run: zam check .
      - name: Zamak unit tests
        run: zam test .
      - name: Native build
        run: bash scripts/build-arch.sh
