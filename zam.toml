[project]
name = "memreduct_zamak"
version = "0.2.0"
description = "Unofficial Linux-native memory cache manager built with Zamak"
entry = "src/main.zm"
modules = "src"

[native]
# crossproc_plan.c is the unprivileged planner (ADR-0007) and is always built.
# crossproc_advise.c is the writable half: it compiles to a refusing stub unless
# production_clean_gate_default.c is the default-build capability gate: it
# makes mr_production_clean_enabled() answer 0, so the shipped binary cannot
# reach the pkexec bridge. The production build script swaps in
# production_clean_gate_enabled.c instead; see ADR-0005 and
# scripts/ci/build-production-clean-gui.sh.
# MEMREDUCT_ENABLE_PRODUCTION_ADVISE is defined, so listing it here does not
# enable anything. Enabling it is a deliberate build decision.
sources = ["native/async_privileged.c", "native/production_clean_gate_default.c", "native/crossproc_advise.c", "native/crossproc_plan.c", "native/gui_test.c", "native/gui_window.c", "native/preferences_store.c", "native/self_reclaim.c"]
